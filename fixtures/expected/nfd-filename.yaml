version: 1
case_id: nfd-filename
purpose: Exercise lookup and display with generated NFC and NFD filenames.
document:
  front_matter: {present: false, properties: {}}
  outline:
    - {level: 1, text: NFD fixture, slug: nfd-fixture}
  feature_counts:
    headings: 1
expectations:
  security:
    raw_html_policy: text
    blocked_url_schemes: [javascript, vbscript, data]
    invariants:
      - Normalization fallback cannot escape the approved workspace.
  extensions:
    path_semantics:
      requested_normalizations: [NFC, NFD]
      lookup_accepts_canonical_equivalent: true
      display_name_may_normalize: true
  notes:
    - Exact on-disk normalization must be recorded by platform filesystem tests.
    - The committed input has an ASCII name; runtime_path generates each spelling in a separate directory.
    - Raw filesystem canonical-equivalent lookup is reported, not required; adapters own any fallback.
