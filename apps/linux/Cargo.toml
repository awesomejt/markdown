# The Linux host is its own workspace: the root workspace and its dependency
# policy cover only the portable core (core/), and gtk-rs is not a core dependency.
[workspace]
members = [".", "core"]
resolver = "3"

[package]
name = "markdown-linux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[[bin]]
name = "markdown-linux"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_14"] }
markdown-linux-core = { path = "core" }

[profile.release]
codegen-units = 1
lto = "thin"
