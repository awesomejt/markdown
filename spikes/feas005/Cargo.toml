[package]
name = "linux-native-rendering-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_10"] }
pulldown-cmark = { version = "=0.13.5", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

