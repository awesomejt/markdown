- Swift Markdown plus attributed adapter, not Rust/core FFI or product-model measurement.
- Parsing, conversion and eager row sizing are synchronous; cancellation unimplemented.
- 80 trials are serial in fixed variant order on one active desktop; warm caches,
  no cold-launch claim.
- Basic semantic presentation only; no full GFM conformance, raw HTML execution or
  resource fetch.
- Only one scale-2 5K 60 Hz display tested; mixed DPI, dynamic display changes and
  other OS versions unverified.
- Reusable rows omit continuous cross-row selection and heading navigation; full attributed
  model still resident.
- Timer delay is not display frame pacing; drag/trackpad, print and state restoration
  remain unverified.
