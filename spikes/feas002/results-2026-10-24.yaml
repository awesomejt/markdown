schema_version: 1
scope: Parse and walk each document; rendering and FFI conversion are excluded.
environment:
  os: CachyOS Linux rolling
  kernel: 7.3.0-4-cachyos
  architecture: x86_64
  cpu: AMD Ryzen 9 5950X 16-Core Processor
  logical_cpus: 32
  rustc: 1.99.1
  cargo: 1.99.1
  gcc: 16.2.1
  cmake: 4.4.4
candidates:
  comrak:
    version: 0.57.0
    license: BSD-2-Clause
    configuration: default features off; selected GFM, footnote, front-matter, math, and alert extensions
  pulldown-cmark:
    version: 0.13.5
    license: MIT
    configuration: default features off; selected GFM, footnote, and math options
  cmark-gfm:
    version: 0.29.0.gfm.13
    commit: 587a12bb54d95ac37241377e6ddc93ea0e45439b
    license: BSD-2-Clause
    configuration: static C99 release build; core GFM extensions and footnotes
method:
  warmups_per_process: 1
  measured_trials: 5
  one_mib_iterations_per_trial: 10
  five_mib_iterations_per_trial: 3
  statistic: median ns_per_iteration across five process invocations
median_parse_and_walk_ms:
  delimiter-storm-1mib:
    comrak: 24.092058
    pulldown-cmark: 9.109524
    cmark-gfm: 28.361628
  long-lines-1mib:
    comrak: 0.531726
    pulldown-cmark: 0.463887
    cmark-gfm: 0.907789
  prose-1mib:
    comrak: 11.072543
    pulldown-cmark: 4.462422
    cmark-gfm: 13.159106
  prose-5mib:
    comrak: 90.293229
    pulldown-cmark: 22.785896
    cmark-gfm: 90.231150
peak_rss_kib:
  note: zsh process maximum RSS; one warmup plus one measured parse in a fresh process
  prose-5mib:
    comrak: 107896
    pulldown-cmark: 41412
    cmark-gfm: 119808
  delimiter-storm-1mib:
    comrak: 40416
    pulldown-cmark: 17628
    cmark-gfm: 44708
probe_binary_bytes:
  note: Rust probe includes both Rust candidates; C probe statically links cmark-gfm.
  combined_rust_probe: 1428528
  cmark_gfm_probe: 368248
limitations:
  - Results describe one Linux workstation and are comparative, not release budgets.
  - Node and event counts differ, so work per engine is similar but not identical.
  - Peak RSS includes input, runtime, warmup allocator retention, and the probe process.
  - Neither native rendering nor stable-facade conversion is included.
  - Swift Markdown was not executed because this host has no Swift toolchain.

