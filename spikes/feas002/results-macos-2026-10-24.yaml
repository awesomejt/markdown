limitations:
- One Mac; warm caches; not cold launch, rendering, semantic-model construction, FFI,
  signing, or packaging evidence.
- Different API shapes, walks, enabled extensions and cmark versions; not identical
  work or conformance proof.
- Swift walks a value tree and accesses ranges; Rust Comrak walks twice and pulldown
  counts events.
- Peak RSS is whole process and includes runtime, input and allocator retention; not
  live heap.
- Single-iteration memory checks have one fresh-process observation per engine/input;
  not five-trial medians.
- Raw main-run trials are in ignored build/feas002-macos/trials.csv; eight extra memory
  observations are preserved here.
