  owner_confirmed:
  - mouse drag selection with auto-scroll, Shift+click extension, click and Esc clear, reselection replaces
  - keyboard row navigation with plain Up/Down and selection extension
  - Ctrl+A/Ctrl+C of 5 MiB (clipboard verified externally)
  - find, outline click/arrow/Enter, fragment and blocked links, image policy display
  - Orca reads rows in order while moving with Down
  owner_found_and_fixed:
  - drag lost its anchor on an empty first update
  - row label gesture stole the drag after a few pixels
  - GtkLabel kept merged highlight attributes so clear and reselect failed visually
  - plain Up/Down did not move between rows
  - heading jumps scrolled minimally instead of aligning to the top
  - outline arrows had no visible selection
  open:
  - Orca H structural heading navigation does nothing in the native view
  - Orca Say All past the visible screen not confirmed
  - Orca on the WebView build not compared
  - GNOME, X11, fractional scaling and RTL/IME not tested
webview_checks:
  copy: real Ctrl+A/Ctrl+C put text/html and text/plain (2054 characters, whole tour) on the clipboard;
    no Markdown flavor; synthetic editing-command copy was unreliable under Wayland
  find_5mib_first_result_ms: 328
  policy: CSP default-src none, page scripts disabled, mdv-res scheme reusing host containment checks,
    navigation gated by link policy; symlink, forged and missing images refused
