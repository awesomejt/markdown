outliers:
- First cold native prose-1mib run of the first sweep took 8078 ms; not reproduced in two later sweeps
  (cold max 538-545 ms). Retained in the superseded sweep log only.
- First cold WebView prose-1mib run took 13203 ms (included in the values above).
- 'WebView prose-5mib: the compositor reported no presentation time in any run; values are paint times.'
design_constraint:
  realized_rows: GtkListView realizes about 205 rows regardless of row height; AT-SPI exposes only the
    about 30 on-screen rows
  label_minimum_width: wrapped GtkLabel minimum-width measurement cost about 18x raw Pango layout; width-chars
    40 removes it
  fragments: at most 1024 bytes at a newline or space; unbreakable runs cut at 512 bytes and shown with
    character wrapping
  sweep_single_launch_ms:
    before_width_chars:
      long_lines_512: 2036
      long_lines_1024: 6377
      long_lines_2048: 23709
      long_lines_4096: timeout >60000
      long_paragraph_512: 667
      long_paragraph_1024: 1049
      long_paragraph_4096: 3469
    with_width_chars:
      long_lines_char_wrap_512: 350
      long_lines_char_wrap_1024: 468
      long_paragraph_1024: 348
      long_paragraph_4096: 666
      prose_5mib: 247
  accessibility_cost: disabling GTK accessibility or row labels changed long-paragraph launch by under
    7 percent
functional_checks:
  select_all_copy_5mib:
    text_markdown_equals_source_bytes: 5242880
    text_plain_equals_model_bytes: 5170055
    verified_with: wl-paste from a separate process after owner Ctrl+A, Ctrl+C
    automated_copy_ms_5mib: about 9
  sampled_rows: 5 rows per run at 10-100 percent of the document; displayed label text equals the model
    fragment and the copy at its offset, in every run
  find: model search of 5 MiB in about 8 ms; off-screen match scrolled, selected and presented
  outline_and_fragment_jumps: off-screen headings presented with focus in about 36-55 ms, aligned to the
    viewport top except where the document end prevents it
  images:
    presented:
    - img/gradient.png 240x120
    blocked_by_model:
    - remote https
    - ../ escape
    - absolute path
    - svg
    - data URI
    refused_by_host_adapter:
    - symlink resolving outside folder
    - text file named .png
    - PNG header claiming 20000x20000
    - missing file
  links:
    fragment: jump
    missing_fragment: ignored
    https_mailto: system handler (gtk UriLauncher)
    relative_md: local document intent, opening not implemented
    blocked:
    - 'javascript:'
    - 'file:'
    - 'data:'
    - ../../ escape
