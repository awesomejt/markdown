  counting: physical lines after cargo fmt, comments included
  shared_model: 955 including 212 test lines and 68 HTML-rendering lines
  native_host: 1770 plus a 49-line list model; the final 335 lines are automation and control-mode probes
  webview_host: 471; the final 130 lines are automation
