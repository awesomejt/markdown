  uia_findings:
  - AutomationProperties.HeadingLevel on the ListViewItem container is not exposed (UIA reports none); the same
    level on the row's RichTextBlock is, and Narrator heading navigation then works
  - A whole-window TreeScope_Descendants search for the document list exceeds the 20 s UIA provider timeout on prose-5mib;
    entering from the focused row takes about 10 ms
  - ItemContainer FindItemByProperty reaches unrealized items as VirtualizedItem peers at about 0.3-0.4 ms per item
    (2000 in 0.6-0.8 s)
  - Windows PowerShell's managed UIA client cannot read HeadingLevel or PositionInSet; the probe uses the native
    UIA3 COM client
  owner_confirmed:
  - 'C# AOT: mouse drag with auto-scroll, Shift+click extension, Esc clear (after fix)'
  - 'C# AOT: keyboard row navigation and Shift+arrow/Shift+Ctrl+End selection (after fix)'
  - 'C# AOT: Ctrl+A/Ctrl+C of 5 MiB, verified externally'
  - 'C# AOT: find with Enter, F3 and Shift+F3'
  - 'C# AOT: outline click jump and Enter moving focus into the document (after fix)'
  - 'C# AOT: gradient image presented, refused images show reasons, fragment/https/blocked links'
  - 'C# AOT: Narrator reads rows in order with Down, H/Shift+H move between headings, and continuous reading continues
    past the visible rows until Ctrl'
  - 'C++/WinRT: drag selection and Esc; Ctrl+A/Ctrl+C of the media fixture verified externally'
  owner_found_and_fixed:
  - Esc cleared only when keyboard focus was already in the document
  - a row click did not move keyboard focus, so arrows and Ctrl+A/C did nothing after clicking
  - Enter in the outline did not reach the handler (the list consumes it before KeyDown)
  - Narrator heading navigation found no headings (heading level only on the container)
  open:
  - 'Narrator reads each row twice: the list item name and its text element carry the same content'
  - one owner Ctrl+A in the C++ host produced no selection and was not reproduced, including with input tracing;
    Narrator scan mode or an unfocused click are the likely causes
  - the owner did not check the C++ host with Narrator; UIA inspection shows the same tree as C#
  - WebView2 not checked with Narrator
  - mixed DPI, RTL, IME, high contrast and touch not tested
native_aot_findings:
- VisualTreeHelper children may be projected as plain DependencyObject; `is ScrollViewer` failed and QueryInterface
  (WinRT.CastExtensions.As) is required
- PublishAot in a project also applies AOT feature switches (dynamic code off, EventSource off) to plain builds;
  the JIT host is a separate project without it
- WebView2 works under Native AOT; an earlier null CoreWebView2 came from orphaned msedgewebview2 processes holding
  the user-data folder after a killed run
webview_checks:
  select_all_5mib_ms: 160
  selected_chars_5mib: 4733157
  policy: CSP default-src none; raw HTML already inert; document and images served through WebResourceRequested
    from a virtual host with the same ImagePolicy; navigation outside the document cancelled; script execution stays
    enabled because IsScriptEnabled=false also disables ExecuteScriptAsync, which the frame probe needs
  images: gradient served; symlink, forged, oversize and missing refused by the host; blocked requests carry an
    empty src
implementation_size_lines:
  counting: physical lines, comments included
  shared_model: 955 (unchanged from Linux)
  c_abi_crate: 548 plus a 77-line header; 80 test lines
  csharp_host: 1132 (window 728, interop 147, platform adapters 182, entry 75) plus 323 lines of automation and
    control commands; the JIT and AOT builds share every line
  cpp_host: 1432 in one file, of which about 270 are automation and control commands
  webview_host: 257, of which about 30 are checks
  probes_and_harness: UIA probe 154 C++, uia_probe.py 72, measure_windows.py 233, clipboard_check.py 105, build_windows.py
    151
