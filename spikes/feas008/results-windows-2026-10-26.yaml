outliers:
- First cold C# JIT prose-1mib run 640 ms against 488-512 ms for the other four (included above).
- First cold WebView2 prose-1mib run 1233 ms (included above).
- WebView2 prose-5mib cold and warm medians differ by 6 ms because engine layout dominates.
design_constraint:
  realized_rows: ListView (ItemsStackPanel, default cache) realizes about 15 rows at launch for prose and 5 for
    512-byte character-wrapped long lines, against about 205 in GtkListView; about 32-48 after jumps
  row_container: rows are ListViewItem containers whose visuals move into a one-Grid DataTemplate root on ContainerContentChanging;
    marking containers prepared in ChoosingItemContainer, or replacing ListViewItem.Content, left some rows unmeasured
    (19 px, zero-width text)
  presented_guard: the presented condition requires laid-out text (RichTextBlock ActualWidth > 0); an early run
    without it timed empty containers and was discarded
  fragments: the same docmodel fragments as Linux (1024 bytes at a newline or space; 512-byte unbreakable cuts);
    TextWrapping.Wrap breaks inside words with no extra setting
functional_checks:
  select_all_copy_5mib:
    text_markdown_equals_source_bytes: 5242880
    cf_unicodetext_equals_model_bytes: 5170055
    verified_with: clipboard_check.py from a separate process after owner Ctrl+A, Ctrl+C in the C# AOT host; the
      C++ host passed the same check on the media fixture after owner Ctrl+A, Ctrl+C and on 5 MiB under scripted
      copy
    clipboard: Win32 CF_UNICODETEXT plus a registered text/markdown format holding UTF-8 source bytes; a DataPackage
      stream custom format failed with CLIPBRD_E_BAD_DATA after Clipboard.Flush
    automated_copy_ms_5mib: 15-18
  sampled_rows: 5 rows per run at 10-100 percent; displayed run text equals the model fragment and the copy at its
    offset, every run, every native host
  find: model search of 5 MiB in about 13-17 ms; off-screen match scrolled, selected and presented in about 30-35
    ms
  outline_and_fragment_jumps: off-screen headings presented with focus in about 48-52 ms, aligned to the viewport
    top except at the document end
  highlight: TextHighlighter ranges index plain characters across Run and Hyperlink boundaries; verified by screenshot
    across bold, link, code and a two-byte character
  images:
    presented:
    - img/gradient.png 240x120
    blocked_by_model:
    - remote https
    - ../ escape
    - absolute path
    - svg
    - data URI
    refused_by_host_adapter:
    - symlink resolving outside folder (GetFinalPathNameByHandle)
    - text file named .png
    - PNG header claiming 20000x20000
    - missing file
  links:
    fragment: jump with focus
    missing_fragment: ignored
    https_mailto: Launcher.LaunchUriAsync
    relative_md: local document intent, opening not implemented
    blocked:
    - 'javascript:'
    - 'file:'
    - 'data:'
    - ../../ escape
