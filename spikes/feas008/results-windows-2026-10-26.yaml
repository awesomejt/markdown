metric:
  definition: 'D-012 launch to presented content: QueryPerformanceCounter read by the launcher just before CreateProcess
    (FEAS008_LAUNCH_QPC) to the return of DwmFlush on a worker started at low dispatcher priority after the first
    CompositionTarget.Rendering tick in which a realized row''s text is laid out'
  cold: 'elevated: SetSystemFileCacheSize(-1,-1), MemoryFlushModifiedList and MemoryPurgeStandbyList before each
    run, then a 2 s pause'
  warm: one discarded launch, then five, 1 s apart
  runs_per_mode: 5
  webview_presented: DwmFlush after the message from an injected double requestAnimationFrame; approximates the
    engine's first content frame
  memory: peak working set; WebView2 sums the host and every engine process it reports (browser, renderer, GPU,
    utility)
  checks: every timed run also ran the full automated checks after presentation
