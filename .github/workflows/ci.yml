name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      linux: ${{ steps.paths.outputs.linux }}
      windows: ${{ steps.paths.outputs.windows }}
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          # PR pushes may skip host checks when only state/docs follow a green head.
          PREV: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_paths.py

  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -r tools/requirements-fixtures.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python tools/check.py common
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  core:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
          - os: windows-latest
            host: windows
          - os: macos-latest
            host: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs[matrix.host] == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: needs.changes.outputs[matrix.host] == 'true'
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, explicit toolchain below
        if: needs.changes.outputs[matrix.host] == 'true'
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs[matrix.host] == 'true'
      - run: python tools/check.py core
        if: needs.changes.outputs[matrix.host] == 'true'
      # Release time guards and the model-v2-only build run on main and manual runs;
      # PR authors run them locally through `tools/check.py all` (TOOL-002, D-028).
      - run: python tools/check.py core-extended
        if: needs.changes.outputs[matrix.host] == 'true' && github.event_name != 'pull_request'

  complete:
    if: always()
    needs: [changes, common, core]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          COMMON: ${{ needs.common.result }}
          CORE: ${{ needs.core.result }}
        run: test "$CHANGES" = success && test "$COMMON" = success && test "$CORE" = success
