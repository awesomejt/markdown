  - &id032
    id: e8a88736-97a1-41bb-aa5a-2ae8d422b2b0
    task_key: TOOL-003
    title: Whitespace check on a new branch's first push covers only its new commits
    description: 'Found 2026-10-28 when develop was first pushed (D-030): GitHub sends an all-zero before
      SHA, so tools/check_git.py diffs the whole tree from the empty tree and fails on long-standing trailing
      whitespace (Decisions.md hard breaks, spike EOF lines). Every review/<milestone> first push would
      hit it. On a zero base, check only the commits reachable from HEAD and not from any other remote
      branch (excluding the pushed branch, named by GITHUB_REF_NAME); keep the empty-tree check when there
      are no other remote branches. Placed before CORE-003D.'
    phase: portable-core
    role: coder
    priority: 84
