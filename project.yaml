      Indic and emoji ZWJ titles lose their metadata. File names already exempt both (CORE-005D). Allow
      ZWNJ and ZWJ in the title and string/list values, not in keys, in the producer and shared validate_structure
      (v1, v2, from_json parity). Keep bidi embedding/override/isolate controls (U+202A..U+202E, U+2066..U+2069)
      rejected; LRM/RLM stay rejected unless the owner decides otherwise. Decide and record whether emoji
      tag characters (U+E0020..U+E007F) are allowed only inside a well-formed tag sequence after U+1F3F4
      ending in U+E007F. Amends D-032 with a new decision record; update docs/Front-Matter.md and the
      model specs.'
