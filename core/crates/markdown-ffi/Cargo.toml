[package]
name = "markdown-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hand-written versioned C ABI over markdown-core (header: core/include/markdown_core.h)"

[lib]
name = "markdown_ffi"
# rlib for Rust tests; cdylib/staticlib are the native package artifacts.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
markdown-core = { path = "../markdown-core" }
serde_json = "=1.0.145"

[features]
model-v2 = ["markdown-core/model-v2"]
