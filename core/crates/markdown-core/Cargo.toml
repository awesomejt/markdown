[package]
name = "markdown-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
schemars = { version = "=1.0.4", optional = true }

[features]
schema = ["dep:schemars"]

[[example]]
name = "export_schema"
required-features = ["schema"]
