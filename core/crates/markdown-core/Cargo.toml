[package]
name = "markdown-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
url = { version = "=2.5.8", optional = true }
pulldown-cmark = { version = "=0.13.5", default-features = false }
unicase = "=2.10.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
schemars = { version = "=1.0.4", optional = true }

[features]
model-v2 = ["dep:url"]
schema = ["dep:schemars"]

[[example]]
name = "export_schema"
required-features = ["schema"]

[[example]]
name = "export_schema_v2"
required-features = ["schema", "model-v2"]

[[example]]
name = "parse_markdown_v2"
required-features = ["model-v2"]
